api:
  gamma_url: "https://gamma-api.polymarket.com"
  clob_url: "https://clob.polymarket.com"
  timeout_seconds: 5.0
  rate_limit_concurrent_reqs: 50

trading:
  collateral_token: "pUSD"
  maker_fee: 0.00      # Polymarket spesso ha 0 fee per maker
  taker_fee: 0.00      # Variabile, teniamo 0 come default base, override nel codice
  slippage_tolerance: 0.005 # 0.5%