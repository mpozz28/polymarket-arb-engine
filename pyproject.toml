[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-arb-engine"
version = "0.1.0"
description = "Polymarket Mispricing & Arbitrage Detection Engine"
authors = [{name = "Quant Developer"}]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "py-clob-client-v2>=2.0.0", # SDK aggiornato post-migrazione 2026
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",          # Per salvataggio order books in Parquet
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: mark a test as a coroutine."
]