[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-arb-engine"
version = "0.2.0"
description = "Polymarket market-data, arbitrage detection and paper-trading engine"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.16.3",
    "pydantic>=2.13.0",
    "PyYAML>=6.0.3",
    "pandas>=3.0.0",
    "numpy>=2.5.0",
    "websockets>=17.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.13.0",
    "mypy>=1.17.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
